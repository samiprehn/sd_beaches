<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Beach Info</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏖️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { min-height: 100vh; background: linear-gradient(90deg, #e2bb7e 0%, #f0d9a8 35%, #fff5dc 60%, #ffffff 64%, #c2e6f6 72%, #5fb4e6 88%, #1d7fc4 100%); }
        #sand-emojis { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .sand-emoji { position: absolute; user-select: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
        #app { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <div id="sand-emojis"></div>
    <div id="app"></div>

    <script type="module">
        const beaches = [
            { name: "Oceanside", lat: 33.1959, lon: -117.3795,
                webcams: [
                    { name: "Oceanside Rooftop Bar", url: "https://www.webcamtaxi.com/en/usa/california/oceanside-beach-cam.html"}
                ] },
            { name: "Carlsbad", lat: 33.1581, lon: -117.3506,
                webcams: [
                    { name: "Carlsbad Beach Surf", url: "https://hdontap.com/stream/155380/carlsbad-beach-surf-live-webcam/"},
                    { name: "Ponto Beach", url: "https://www.surfoutlook.com/surfcam/sandiego/ponto"}
                ] },
            { name: "Encinitas", lat: 33.0462, lon: -117.2931,
                 webcams: [
                     { name: "Moonlight Beach", url: "https://www.skylinewebcams.com/en/webcam/united-states/california/encinitas/encinitas-california.html"}
                 ] },
            { name: "Cardiff", lat: 33.0214, lon: -117.2806, webcams: [] },
            { name: "Solana Beach", lat: 32.9911, lon: -117.2714, webcams: [] },
            { name: "Del Mar", lat: 32.9595, lon: -117.2654,
                webcams: [
                    { name: "Del Mar Beach North", url: "https://hdontap.com/stream/199841/del-mar-beach-north-live-webcam/" },
                    { name: "Del Mar Beach Community Overlook", url: "https://hdontap.com/stream/101962/del-mar-beach-community-ultra-hd-overlook-live-webcvam/" },
                    { name: "17th St Del Mar Beach Southwest", url: "https://hdontap.com/stream/122912/17th-st-del-mar-beach-4k-southwest-live-webcam/" },
                    { name: "Del Mar Beach South Roaming", url: "https://hdontap.com/stream/399483/del-mar-beach-south-roaming-live-webcam/" }
                ] },
            { name: "La Jolla Shores", lat: 32.8571, lon: -117.2573,
                webcams: [
                    {name: "Scripps Pier", url: "https://scripps.ucsd.edu/piercam"},
                    {name: "La Jolla Shores Surf", url: "https://hdontap.com/stream/532541/la-jolla-shores-live-surf-cam/" },
                    {name: "La Jolla Shores Hotel", url: "https://www.ljshoreshotel.com/beach-cam/" },
                    {name: "La Jolla Shores Overlook", url: "https://hdontap.com/stream/449923/la-jolla-shores-overlook-live-webcam/" }
                ] },
            { name: "Pacific Beach", lat: 32.7942, lon: -117.2528,
                webcams: [
                    {name: "Pacific Beach Surf", url: "https://hdontap.com/stream/186699/pacific-beach-live-surf-webcam/" }
                ] },
            { name: "Mission Bay", lat: 32.7778, lon: -117.2265,
                webcams: [
                    {name: "Mission Bay Resort", url: "https://hdontap.com/stream/265560/san-diego-mission-bay-resort-live-webcam/" },
                    {name: "Mission Bay & Beach", url: "https://www.catamaranresort.com/live-cam?utm_source=sdta"}
                ] },
            { name: "Ocean Beach", lat: 32.7503, lon: -117.2517,
                webcams: [
                    { name: "OB Beach Cam", url: "https://oceanbeachsandiego.com/media/ob-beach-cam" }
                ] },
            { name: "Coronado", lat: 32.6859, lon: -117.1831,
                webcams: [
                    { name: "Hotel Del Coronado North Roaming", url: "https://hdontap.com/stream/327869/hotel-del-coronado-north-roaming-live-cam/" },
                    { name: "Hotel Del Coronado Roaming", url: "https://hdontap.com/stream/964952/hotel-del-coronado-4k-roaming-live-cam/" }
                ] },
            { name: "Imperial Beach", lat: 32.5792, lon: -117.1131,
                webcams: [
                    { name: "Imperial Beach Pier", url: "https://www.surfline.com/surf-report/imperial-beach-pier/5842041f4e65fad6a7708844?camId=58349a7fe411dc743a5d529d" }
                ] }
        ];

        const waterTempStations = [
            { name: "Oceanside", buoyId: "46224" },
            { name: "Leucadia", buoyId: "46274" },
            { name: "Del Mar", buoyId: "46266" },
            { name: "La Jolla Shores", buoyId: "LJAC1" },
            { name: "San Diego Bay", buoyId: "SDBC1" },
            { name: "Imperial Beach", buoyId: "46235" }
        ];

        const UV_HOURS = [['10 AM', 10], ['Noon', 12], ['2 PM', 14], ['4 PM', 16]];
        const NDBC_MISSING = new Set([99, 999]);
        const WEATHER_EMOJI = {
            0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
            45: "🌫️", 48: "🌫️", 51: "🌦️", 53: "🌧️",
            61: "🌧️", 63: "🌧️", 65: "🌧️",
            80: "🌦️", 95: "⛈️"
        };
        const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

        let weatherData = {};
        let waterTempData = {};
        let tideData = null;
        let sunData = null;
        let uvData = null;
        let loading = true;
        let selectedTab = 'today';

        const weatherEmoji = (code) => WEATHER_EMOJI[code] || "🌈";
        const windDir = (deg) => COMPASS[Math.round(deg / 45) % 8];

        // 0 = Sunday, 6 = Saturday
        const getNextDayOfWeek = (dayOfWeek) => {
            const today = new Date();
            let daysToAdd = dayOfWeek - today.getDay();
            if (daysToAdd <= 0) daysToAdd += 7;
            const t = new Date(today);
            t.setDate(today.getDate() + daysToAdd);
            return t;
        };

        const dateForTab = (tab) => {
            if (tab === 'saturday') return getNextDayOfWeek(6);
            if (tab === 'sunday') return getNextDayOfWeek(0);
            return new Date();
        };

        const sameDay = (a, b) =>
            a.getDate() === b.getDate() &&
            a.getMonth() === b.getMonth() &&
            a.getFullYear() === b.getFullYear();

        const ymd = (d) => d.toISOString().split('T')[0].replace(/-/g, '');
        const isoDate = (d) => d.toISOString().split('T')[0];
        const fmtTime = (d, tz) => d.toLocaleTimeString('en-US',
            tz ? { hour: 'numeric', minute: '2-digit', timeZone: tz } : { hour: 'numeric', minute: '2-digit' });
        const fmtDateShort = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const spinner = (borderClass) => `
            <div class="flex items-center justify-center py-4">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 ${borderClass}"></div>
            </div>`;

        const sectionHeader = (title, gradientClasses) => `
            <div class="bg-gradient-to-r ${gradientClasses} p-3 text-white">
                <h2 class="text-xl font-bold">${title}</h2>
            </div>`;

        const setTab = (tab) => {
            selectedTab = tab;
            weatherData = {};
            waterTempData = {};
            tideData = null;
            sunData = null;
            uvData = null;
            loading = true;
            render();
            fetchData();
        };

        async function fetchWaterTemp(buoyId) {
            try {
                const res = await fetch(`https://noaa-buoy.sami-prehn.workers.dev/?id=${buoyId}`);
                if (!res.ok) return null;

                const lines = (await res.text()).trim().split('\n');
                if (lines.length < 3) return null;

                const headerLine = lines[0].trim().split(/\s+/);
                const dataLine = lines[2].trim().split(/\s+/);
                const wtmpIndex = headerLine.indexOf('WTMP');
                if (wtmpIndex === -1) return null;

                const tempC = parseFloat(dataLine[wtmpIndex]);
                if (isNaN(tempC) || NDBC_MISSING.has(tempC)) return null;

                return (tempC * 9 / 5 + 32).toFixed(1);
            } catch (err) {
                console.error(`Error fetching water temp for buoy ${buoyId}:`, err);
                return null;
            }
        }

        async function fetchBeachWeather(beach, targetDate, dateForApi) {
            try {
                const res = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${beach.lat}&longitude=${beach.lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America/Los_Angeles`
                );
                if (!res.ok) return null;
                const data = await res.json();
                const dateIndex = data.daily.time.findIndex(d => d === dateForApi);

                let peakIdx = -1, peakTemp = -Infinity;
                for (let h = 0; h < data.hourly.time.length; h++) {
                    if (!data.hourly.time[h].startsWith(dateForApi)) continue;
                    const t = data.hourly.temperature_2m[h];
                    if (t > peakTemp) { peakTemp = t; peakIdx = h; }
                }
                const peakFeel = peakIdx >= 0 ? data.hourly.apparent_temperature[peakIdx] : null;

                if (selectedTab === 'today') {
                    return { current: data.current, dailyMax: data.daily.temperature_2m_max[0], peakFeel };
                }
                if (dateIndex === -1) return null;
                const hourIndex = data.hourly.time.findIndex(t => {
                    const dt = new Date(t);
                    return sameDay(dt, targetDate) && dt.getHours() === 12;
                });
                if (hourIndex === -1) return null;
                return {
                    current: {
                        temperature_2m: data.hourly.temperature_2m[hourIndex],
                        relative_humidity_2m: data.hourly.relative_humidity_2m[hourIndex],
                        weather_code: data.hourly.weather_code[hourIndex],
                        wind_speed_10m: data.hourly.wind_speed_10m[hourIndex],
                        wind_direction_10m: data.hourly.wind_direction_10m[hourIndex]
                    },
                    dailyMax: data.daily.temperature_2m_max[dateIndex],
                    peakFeel
                };
            } catch (err) {
                console.error(`Error fetching weather for ${beach.name}:`, err);
                return null;
            }
        }

        const fetchJson = (url) => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);

        async function fetchData() {
            const targetDate = dateForTab(selectedTab);
            const today = ymd(targetDate);
            const tomorrow = ymd(new Date(targetDate.getTime() + 86400000));
            const dateForApi = isoDate(targetDate);

            try {
                const [tideJson, sunJson, uvJson, beachResults, waterResults] = await Promise.all([
                    fetchJson(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${today}&end_date=${tomorrow}&station=9410230&product=predictions&datum=MLLW&time_zone=lst_ldt&units=english&interval=hilo&format=json`),
                    fetchJson(`https://api.sunrise-sunset.org/json?lat=32.7503&lng=-117.2517&formatted=0&date=${dateForApi}`),
                    fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=32.7157&longitude=-117.1611&hourly=uv_index&timezone=America/Los_Angeles`),
                    Promise.all(beaches.map(b => fetchBeachWeather(b, targetDate, dateForApi))),
                    Promise.all(waterTempStations.map(s => fetchWaterTemp(s.buoyId)))
                ]);

                tideData = tideJson?.predictions || [];
                sunData = sunJson?.status === 'OK' ? sunJson.results : null;

                if (uvJson?.hourly) {
                    const times = uvJson.hourly.time.map(t => new Date(t));
                    const uvAt = (hour) => {
                        const i = times.findIndex(d => sameDay(d, targetDate) && d.getHours() === hour);
                        return i === -1 ? null : Math.round(uvJson.hourly.uv_index[i]);
                    };
                    uvData = Object.fromEntries(UV_HOURS.map(([, h]) => [h, uvAt(h)]));
                } else {
                    uvData = null;
                }

                beachResults.forEach((w, i) => { if (w) weatherData[i] = w; });
                waterResults.forEach((t, i) => { waterTempData[i] = t; });
            } catch (err) {
                console.error('Error fetching data:', err);
            }

            loading = false;
            render();
        }

        function tabButton(key, label, date, extraClass = '') {
            const active = selectedTab === key;
            const base = `flex-1 py-1.5 px-2 text-sm font-semibold transition-colors ${extraClass}`;
            const colors = active ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100';
            const subColor = active ? 'text-blue-100' : 'text-gray-500';
            return `<button onclick="setTab('${key}')" class="${base} ${colors}">
                <div>${label}</div>
                <div class="text-xs font-normal ${subColor}">${fmtDateShort(date)}</div>
            </button>`;
        }

        function render() {
            const today = new Date();
            const isSaturday = today.getDay() === 6;
            const nextSaturday = getNextDayOfWeek(6);
            const nextSunday = getNextDayOfWeek(0);

            const tabs = [
                tabButton('today', 'Today', today),
                !isSaturday ? tabButton('saturday', 'Saturday', nextSaturday, 'border-l border-r border-gray-200') : '',
                tabButton('sunday', 'Sunday', nextSunday, 'border-l border-gray-200')
            ].join('');

            const tzLA = 'America/Los_Angeles';

            const html = `
                <div class="p-2">
                    <div class="max-w-6xl mx-auto">
                        <div class="text-center mb-2">
                            <h1 class="text-2xl font-bold" style="color: #3a2510; text-shadow: 0 1px 3px rgba(255,255,255,0.55);">San Diego Beach Info</h1>
                        </div>

                        <div class="bg-white rounded-lg shadow-md overflow-hidden mb-2">
                            <div class="flex">${tabs}</div>
                        </div>

                        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-3">
                            ${sectionHeader('Timing', 'from-cyan-600 to-blue-600')}
                            <div class="p-3 bg-gradient-to-br from-cyan-50 to-blue-50">
                                ${loading ? `
                                    <div class="bg-white p-4 rounded-lg text-center border border-cyan-100">
                                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-cyan-600 mx-auto"></div>
                                        <p class="text-gray-600 mt-2 text-sm">Loading data...</p>
                                    </div>
                                ` : `
                                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
                                        ${sunData ? `
                                            <div class="bg-white p-2 rounded-lg border border-amber-200">
                                                <p class="text-xs font-semibold mb-1 text-amber-600">Sunrise</p>
                                                <p class="text-base font-bold text-gray-900">${fmtTime(new Date(sunData.sunrise), tzLA)}</p>
                                            </div>
                                            <div class="bg-white p-2 rounded-lg border border-orange-200">
                                                <p class="text-xs font-semibold mb-1 text-orange-600">Sunset</p>
                                                <p class="text-base font-bold text-gray-900">${fmtTime(new Date(sunData.sunset), tzLA)}</p>
                                            </div>
                                        ` : ''}
                                        ${tideData && tideData.length > 0 ? tideData.slice(0, 4).map(tide => `
                                            <div class="bg-white p-2 rounded-lg border border-cyan-100">
                                                <p class="text-xs font-semibold mb-1 ${tide.type === 'H' ? 'text-blue-600' : 'text-orange-600'}">
                                                    ${tide.type === 'H' ? 'High Tide' : 'Low Tide'}
                                                </p>
                                                <p class="text-base font-bold text-gray-900">${fmtTime(new Date(tide.t))} (${parseFloat(tide.v).toFixed(1)} ft)</p>
                                            </div>
                                        `).join('') : `
                                            <div class="bg-white p-2 rounded-lg text-center border border-cyan-100 col-span-4">
                                                <p class="text-gray-600 text-sm">Tide data unavailable</p>
                                            </div>
                                        `}
                                    </div>
                                `}
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-3">
                            ${sectionHeader('Conditions', 'from-amber-500 to-yellow-600')}
                            <div class="p-3">
                                ${loading || !weatherData[0] ? spinner('border-blue-600') : `
                                    <div class="overflow-x-auto">
                                        <table class="w-full">
                                            <thead>
                                                <tr class="border-b border-gray-200">
                                                    <th class="text-left py-2 px-2 font-semibold text-gray-700 text-sm">Beach</th>
                                                    ${selectedTab === 'today' ? '<th class="text-center py-2 px-2 font-semibold text-gray-700 text-sm">Current Temp</th>' : ''}
                                                    <th class="text-center py-2 px-2 font-semibold text-gray-700 text-sm">High Temp</th>
                                                    <th class="text-center py-2 px-2 font-semibold text-gray-700 text-sm">Outlook</th>
                                                    <th class="text-center py-2 px-2 font-semibold text-gray-700 text-sm">Wind (mph)</th>
                                                    <th class="text-center py-2 px-2 font-semibold text-gray-700 text-sm">Humidity</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${beaches.map((beach, idx) => {
                                                    const weather = weatherData[idx];
                                                    if (!weather) return '';
                                                    return `
                                                        <tr class="border-b border-gray-100 hover:bg-amber-50 transition-colors">
                                                            <td class="py-2 px-2">
                                                                <div class="font-bold text-gray-900 text-sm">${beach.name}</div>
                                                            </td>
                                                            ${selectedTab === 'today' ? `
                                                            <td class="text-center py-2 px-2">
                                                                <div class="text-lg font-bold text-blue-600">${Math.round(weather.current.temperature_2m)}°</div>
                                                            </td>
                                                            ` : ''}
                                                            <td class="text-center py-2 px-2">
                                                                <div class="text-lg font-bold text-orange-600 whitespace-nowrap">${Math.round(weather.dailyMax)}°${weather.peakFeel != null ? `<span class="text-xs text-gray-500 font-normal ml-1">feels ${Math.round(weather.peakFeel)}°</span>` : ''}</div>
                                                            </td>
                                                            <td class="text-center py-2 px-2">
                                                                <div class="font-semibold text-gray-900 text-sm">${weatherEmoji(weather.current.weather_code)}</div>
                                                            </td>
                                                            <td class="text-center py-2 px-2">
                                                                <div class="font-semibold text-gray-900 text-sm">${Math.round(weather.current.wind_speed_10m)} ${windDir(weather.current.wind_direction_10m)}</div>
                                                            </td>
                                                            <td class="text-center py-2 px-2">
                                                                <div class="text-base font-bold text-gray-900">${weather.current.relative_humidity_2m}%</div>
                                                            </td>
                                                        </tr>
                                                    `;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                `}
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-3">
                            ${sectionHeader('UV Index', 'from-orange-600 to-yellow-500')}
                            <div class="p-3">
                                ${loading ? spinner('border-orange-600') : uvData ? `
                                    <div class="grid grid-cols-4 gap-2">
                                        ${UV_HOURS.map(([label, h]) => {
                                            const v = uvData[h];
                                            return `<div class="bg-yellow-50 p-2 rounded-lg border border-yellow-200">
                                                <p class="text-xs text-gray-600 mb-1">${label}</p>
                                                <p class="text-xl font-bold text-orange-600">${Number.isFinite(v) ? v : '—'}</p>
                                            </div>`;
                                        }).join('')}
                                    </div>
                                ` : `
                                    <div class="bg-yellow-50 p-2 rounded-lg text-center border border-yellow-200">
                                        <p class="text-gray-600 text-sm">UV data unavailable</p>
                                    </div>
                                `}
                            </div>
                        </div>

                        ${selectedTab === 'today' ? `
                        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-3">
                            ${sectionHeader('Ocean Temperature', 'from-cyan-600 to-teal-600')}
                            <div class="p-3">
                                ${loading ? spinner('border-cyan-600') : `
                                    <div class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-6 gap-2">
                                        ${waterTempStations.map((station, idx) => {
                                            const temp = waterTempData[idx];
                                            return `
                                                <div class="bg-cyan-50 p-2 rounded-lg border border-cyan-100">
                                                    <p class="text-xs text-gray-600 mb-1">${station.name}</p>
                                                    <p class="text-xl font-bold text-cyan-600">${temp ? temp + '°' : '—'}</p>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                        ` : ''}

                        ${selectedTab === 'today' ? `
                        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                            ${sectionHeader('Webcams', 'from-orange-600 to-red-600')}
                            <div class="p-3 space-y-3">
                                ${beaches.filter(b => b.webcams && b.webcams.length > 0).map(beach => `
                                    <div>
                                        <h3 class="text-base font-bold text-gray-900 mb-2">${beach.name}</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                            ${beach.webcams.map(cam => `
                                                <a href="${cam.url}" target="_blank" rel="noopener noreferrer"
                                                   class="block bg-orange-500 hover:bg-orange-700 text-white font-semibold py-2 px-4 rounded-lg text-center transition-colors text-sm">
                                                    ${cam.name}
                                                </a>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('<hr class="my-3 border-gray-200">')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="text-center mt-8 mb-4 text-sm" style="color: #3a2510; text-shadow: 0 1px 2px rgba(255,255,255,0.5);">
                            <a href="https://buymeacoffee.com/samiprehn" target="_blank" rel="noopener noreferrer" class="hover:opacity-70 transition-opacity" style="text-decoration: none; color: inherit;">Keep this page running</a>
                            <span class="mx-2 opacity-60">|</span>
                            <a href="https://samiprehn.github.io/" target="_blank" rel="noopener noreferrer" class="hover:opacity-70 transition-opacity" style="text-decoration: none; color: inherit;">Sami's other sites →</a>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        window.setTab = setTab;

        (function () {
            const container = document.getElementById('sand-emojis');
            if (!container) return;
            const emoji = '🏖️';
            const w = window.innerWidth;
            const h = Math.max(window.innerHeight, document.documentElement.scrollHeight, 1200);
            const target = 18;
            const placed = [];
            const buffer = 14;
            for (let attempt = 0; attempt < target * 8 && placed.length < target; attempt++) {
                const sizeRem = 1.8 + Math.random() * 2.2;
                const r = sizeRem * 16 * 0.55;
                const x = Math.random() * (w * 0.42);
                const y = Math.random() * h;
                let overlap = false;
                for (const p of placed) {
                    const dx = x - p.x, dy = y - p.y;
                    const minDist = r + p.r + buffer;
                    if (dx * dx + dy * dy < minDist * minDist) { overlap = true; break; }
                }
                if (overlap) continue;
                placed.push({ x, y, r });
                const span = document.createElement('span');
                span.className = 'sand-emoji';
                span.textContent = emoji;
                span.style.fontSize = sizeRem + 'rem';
                span.style.left = x.toFixed(0) + 'px';
                span.style.top = y.toFixed(0) + 'px';
                span.style.transform = `rotate(${(Math.random() * 50 - 25).toFixed(0)}deg)`;
                span.style.opacity = (0.7 + Math.random() * 0.3).toFixed(2);
                container.appendChild(span);
            }
        })();

        render();
        fetchData();
    </script>
</body>
</html>
